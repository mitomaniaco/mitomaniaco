<text x="59" y="240" class="s">LOCAL&#8722;FIRST SOFTWARE</text>
<rect x="56" y="264" width="330" height="1" fill="#d8dee4"/>
<text x="56" y="296" class="l"><tspan>I build software that removes friction — </tspan><tspan font-weight="500" fill="#0d1117">usually my own.</tspan></text>
<text x="56" y="319" class="l"><tspan>Offline by default, no cloud tax, and the tool never</tspan></text>
<text x="56" y="342" class="l"><tspan>acts for you: it hands you the decision.</tspan></text>
<text x="56" y="400" class="pn">harvey/</text><text x="224" y="400" class="pd">Prospecting that never sends the message for you.</text>
<text x="56" y="428" class="pn">cobblemon-companion/</text><text x="224" y="428" class="pd">A planner that reads your save.</text>
<text x="56" y="456" class="pn">portfolio/</text><text x="224" y="456" class="pd">Static, fast, no framework tax.</text>
<text x="56" y="592" class="f"><tspan fill="#4c5763">386</tspan> contributions &nbsp; <tspan fill="#4c5763">137</tspan> pull requests &nbsp; <tspan fill="#4c5763">111</tspan> issues &nbsp; <tspan fill="#4c5763">4y 8m</tspan> on github &nbsp; <tspan fill="#4c5763">0</tspan> stars &nbsp; <tspan fill="#4c5763">0</tspan> followers</text>
<desc>ASCII portrait on the right; wordmark cobblemon-companion; 4 years, 8 months, 6 days</desc>
